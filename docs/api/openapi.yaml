openapi: 3.1.0
info:
  description: |-
    タイムライン型 SNS（RaiseTimeline）の API。
    方針・認証・エラー・一覧の考え方は API 設計書（docs/05_api-design.md）を参照。
    エラーはすべて ProblemDetail（RFC 9457）に code（エラーの種類）を加えて返す。
  title: RaiseTimeline API
  version: v1
servers:
- url: /
security:
- bearerAuth: []
tags:
- description: API 設計書 4.6
  name: いいね
- description: API 設計書 4.4
  name: 投稿
- description: API 設計書 4.3
  name: タイムライン
- description: API 設計書 4.2
  name: 利用者・プロフィール
- description: API 設計書 4.5
  name: コメント
- description: API 設計書 4.7
  name: フォロー
- description: 登録・ログイン・トークンの取り直し・ログアウト・パスワードの変更（API 設計書 2.2・4.1）
  name: 認証
paths:
  /api/auth/login:
    post:
      description: 未登録のメールアドレスも LOGIN_FAILED にする（BR-09）。続けて失敗すると一時停止する（BR-08）
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: ログインした
          headers:
            Set-Cookie:
              description: REFRESH_TOKEN（HttpOnly・Secure・SameSite=Strict・Path=/api/auth、期限
                7 日。開発環境だけ Secure なし）
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`VALIDATION_FAILED`：入力内容を確認してください'
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`LOGIN_FAILED`：メールアドレスかパスワードが違います<br>`LOGIN_LOCKED`：ログインに続けて失敗したため、しばらくログインできません。15
            分ほどたってからお試しください'
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`INTERNAL_ERROR`：エラーが発生しました。時間をおいてもう一度お試しください'
      security: []
      summary: ログイン
      tags:
      - 認証
  /api/auth/logout:
    post:
      description: リフレッシュトークンを無効にして Cookie を消す。トークンがない・無効でも 204
      operationId: logout
      parameters:
      - description: CSRF の対策。値は RaiseTimeline。ないときは 403（CSRF_INVALID）
        example: RaiseTimeline
        in: header
        name: X-Requested-With
        required: true
        schema:
          type: string
      - description: リフレッシュトークン
        in: cookie
        name: REFRESH_TOKEN
        schema:
          type: string
      responses:
        "204":
          description: ログアウトした（REFRESH_TOKEN の Cookie を消す）
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`CSRF_INVALID`：エラーが発生しました。時間をおいてもう一度お試しください'
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`INTERNAL_ERROR`：エラーが発生しました。時間をおいてもう一度お試しください'
      security: []
      summary: ログアウト
      tags:
      - 認証
  /api/auth/me:
    get:
      description: メールアドレスを返すのはこの API だけ
      operationId: me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`UNAUTHENTICATED`：ログインの有効期限が切れました。もう一度ログインしてください'
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`INTERNAL_ERROR`：エラーが発生しました。時間をおいてもう一度お試しください'
      summary: ログインしている利用者
      tags:
      - 認証
  /api/auth/refresh:
    post:
      description: リフレッシュトークンも新しくなる。無効にしたトークンが再び送られたら、その利用者のトークンをすべて無効にして 401
      operationId: refresh
      parameters:
      - description: CSRF の対策。値は RaiseTimeline。ないときは 403（CSRF_INVALID）
        example: RaiseTimeline
        in: header
        name: X-Requested-With
        required: true
        schema:
          type: string
      - description: リフレッシュトークン
        in: cookie
        name: REFRESH_TOKEN
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: 取り直した
          headers:
            Set-Cookie:
              description: REFRESH_TOKEN（HttpOnly・Secure・SameSite=Strict・Path=/api/auth、期限
                7 日。開発環境だけ Secure なし）
              schema:
                type: string
              style: simple
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`UNAUTHENTICATED`：ログインの有効期限が切れました。もう一度ログインしてください'
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`CSRF_INVALID`：エラーが発生しました。時間をおいてもう一度お試しください'
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`INTERNAL_ERROR`：エラーが発生しました。時間をおいてもう一度お試しください'
      security: []
      summary: アクセストークンの取り直し
      tags:
      - 認証
  /api/auth/signup:
    post:
      description: 登録したら、そのままログインした状態になる。表示名はユーザー名と同じ値になる（BR-01）
      operationId: signup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: 登録した
          headers:
            Set-Cookie:
              description: REFRESH_TOKEN（HttpOnly・Secure・SameSite=Strict・Path=/api/auth、期限
                7 日。開発環境だけ Secure なし）
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`VALIDATION_FAILED`：入力内容を確認してください'
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`CONFLICT`：入力内容を確認してください'
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`INTERNAL_ERROR`：エラーが発生しました。時間をおいてもう一度お試しください'
      security: []
      summary: 利用者登録
      tags:
      - 認証
  /api/comments/{commentId}:
    delete:
      description: 消せるのは書いた本人と、投稿した本人（BR-35）。コメントを消すと返信も消える（BR-38）
      operationId: delete_1
      parameters:
      - in: path
        name: commentId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: 消した
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`UNAUTHENTICATED`：ログインの有効期限が切れました。もう一度ログインしてください'
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`FORBIDDEN`：この操作はできません'
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`NOT_FOUND`：見つかりません'
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`INTERNAL_ERROR`：エラーが発生しました。時間をおいてもう一度お試しください'
      summary: コメント・返信を消す
      tags:
      - コメント
  /api/comments/{commentId}/replies:
    get:
      description: 古い順。20 件ずつ。続きは nextCursor を cursor に付けて呼ぶ（API 設計書 2.5）
      operationId: listReplies
      parameters:
      - in: path
        name: commentId
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageCommentResponse"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`VALIDATION_FAILED`：入力内容を確認してください'
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`UNAUTHENTICATED`：ログインの有効期限が切れました。もう一度ログインしてください'
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`NOT_FOUND`：見つかりません'
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`INTERNAL_ERROR`：エラーが発生しました。時間をおいてもう一度お試しください'
      summary: 返信の一覧
      tags:
      - コメント
  /api/me/avatar:
    put:
      description: file に画像を 1 枚（5MB まで）。送らなければ 400（errors の REQUIRED）。古いファイルは消す
      operationId: changeAvatar
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`VALIDATION_FAILED`：入力内容を確認してください'
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`UNAUTHENTICATED`：ログインの有効期限が切れました。もう一度ログインしてください'
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`IMAGE_TOO_LARGE`：5MB 以下の画像を選んでください'
        "415":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`IMAGE_TYPE_INVALID`：JPEG・PNG・WebP・GIF の画像を選んでください'
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`INTERNAL_ERROR`：エラーが発生しました。時間をおいてもう一度お試しください'
      summary: アイコンの変更
      tags:
      - 利用者・プロフィール
  /api/me/password:
    put:
      description: 今の端末以外のリフレッシュトークンをすべて無効にする
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
        required: true
      responses:
        "204":
          description: 変更した
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`VALIDATION_FAILED`：入力内容を確認してください<br>`CURRENT_PASSWORD_WRONG`：現在のパスワードが違います'
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`UNAUTHENTICATED`：ログインの有効期限が切れました。もう一度ログインしてください'
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`INTERNAL_ERROR`：エラーが発生しました。時間をおいてもう一度お試しください'
      summary: パスワードの変更
      tags:
      - 認証
  /api/me/profile:
    patch:
      description: 送った項目だけを変える（null の項目は変えない）。自分の今のユーザー名は「使われている」にしない
      operationId: updateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`VALIDATION_FAILED`：入力内容を確認してください'
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`UNAUTHENTICATED`：ログインの有効期限が切れました。もう一度ログインしてください'
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`CONFLICT`：入力内容を確認してください'
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`INTERNAL_ERROR`：エラーが発生しました。時間をおいてもう一度お試しください'
      summary: プロフィールの編集
      tags:
      - 利用者・プロフィール
  /api/posts:
    post:
      description: 本文（0〜280 文字）と画像（0〜4 枚、1 枚 5MB まで。送った順が並び順）。本文も画像もなければ POST_EMPTY（BR-11）
      operationId: create
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreatePostRequest"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostResponse"
          description: 投稿した
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`VALIDATION_FAILED`：入力内容を確認してください<br>`POST_EMPTY`：入力してください<br>`IMAGE_TOO_MANY`：画像は
            4 枚まで添付できます'
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`UNAUTHENTICATED`：ログインの有効期限が切れました。もう一度ログインしてください'
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`IMAGE_TOO_LARGE`：5MB 以下の画像を選んでください'
        "415":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`IMAGE_TYPE_INVALID`：JPEG・PNG・WebP・GIF の画像を選んでください'
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`INTERNAL_ERROR`：エラーが発生しました。時間をおいてもう一度お試しください'
      summary: 投稿する
      tags:
      - 投稿
  /api/posts/{postId}:
    delete:
      description: コメント・いいね・画像も消える（BR-13）
      operationId: delete
      parameters:
      - in: path
        name: postId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: 消した
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`UNAUTHENTICATED`：ログインの有効期限が切れました。もう一度ログインしてください'
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`FORBIDDEN`：この操作はできません'
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`NOT_FOUND`：見つかりません'
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`INTERNAL_ERROR`：エラーが発生しました。時間をおいてもう一度お試しください'
      summary: 投稿を消す
      tags:
      - 投稿
    get:
      description: likedVia は常に null
      operationId: get
      parameters:
      - in: path
        name: postId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`UNAUTHENTICATED`：ログインの有効期限が切れました。もう一度ログインしてください'
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`NOT_FOUND`：見つかりません'
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`INTERNAL_ERROR`：エラーが発生しました。時間をおいてもう一度お試しください'
      summary: 投稿の詳細
      tags:
      - 投稿
    patch:
      description: 変えられるのは本文だけ（BR-15）。editedAt を今にする。画像のない投稿で本文を空にしたら POST_EMPTY
      operationId: update
      parameters:
      - in: path
        name: postId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePostRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostResponse"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`VALIDATION_FAILED`：入力内容を確認してください<br>`POST_EMPTY`：入力してください'
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`UNAUTHENTICATED`：ログインの有効期限が切れました。もう一度ログインしてください'
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`FORBIDDEN`：この操作はできません'
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`NOT_FOUND`：見つかりません'
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`INTERNAL_ERROR`：エラーが発生しました。時間をおいてもう一度お試しください'
      summary: 投稿の本文を変える
      tags:
      - 投稿
  /api/posts/{postId}/comments:
    get:
      description: 古い順。20 件ずつ。続きは nextCursor を cursor に付けて呼ぶ（API 設計書 2.5）
      operationId: list
      parameters:
      - in: path
        name: postId
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageCommentResponse"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`VALIDATION_FAILED`：入力内容を確認してください'
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`UNAUTHENTICATED`：ログインの有効期限が切れました。もう一度ログインしてください'
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`NOT_FOUND`：見つかりません'
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`INTERNAL_ERROR`：エラーが発生しました。時間をおいてもう一度お試しください'
      summary: コメントの一覧
      tags:
      - コメント
    post:
      description: 本文は 1〜280 文字（BR-30）。返信なら parentId に返信先のコメントの ID。返信先がない・別の投稿のコメントなら
        404（BR-37）
      operationId: create_1
      parameters:
      - in: path
        name: postId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentResponse"
          description: コメントした
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`VALIDATION_FAILED`：入力内容を確認してください'
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`UNAUTHENTICATED`：ログインの有効期限が切れました。もう一度ログインしてください'
        "404":
          content:
