components:
  schemas:
    AuthResponse:
      type: object
      description: 登録・ログイン・取り直しの応答。リフレッシュトークンは本文ではなく Cookie で返す
      properties:
        accessToken:
          type: string
          description: "アクセストークン（期限 15 分）。Authorization: Bearer で送る。画面はメモリにだけ置く"
        expiresIn:
          type: integer
          format: int64
          description: アクセストークンの残りの秒数
          example: 900
        tokenType:
          type: string
          example: Bearer
        user:
          $ref: "#/components/schemas/MeResponse"
      required:
      - accessToken
      - expiresIn
      - tokenType
      - user
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 1
          pattern: "^(?=.*[A-Za-z])(?=.*[0-9])[!-~]{8,72}$"
        newPasswordConfirmation:
          type: string
          minLength: 1
      required:
      - currentPassword
      - newPassword
      - newPasswordConfirmation
    CommentResponse:
      type: object
      properties:
        author:
          $ref: "#/components/schemas/UserSummary"
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        deletable:
          type: boolean
          description: 書いた本人か投稿した本人なら true（BR-35）。true のときだけ画面は削除のメニューを出す
        id:
          type: integer
          format: int64
        parentId:
          type: integer
          format: int64
          description: 返信先のコメントの ID。返信でなければ null（BR-37）
        postId:
          type: integer
          format: int64
        replyCount:
          type: integer
          format: int64
          description: 返信の数。返信では 0
      required:
      - author
      - body
      - createdAt
      - deletable
      - id
      - parentId
      - postId
      - replyCount
    CreateCommentRequest:
      type: object
      properties:
        body:
          type: string
          maxLength: 280
          minLength: 1
        parentId:
          type: integer
          format: int64
          description: 返信先のコメントの ID。返信先が返信なら、その返信先への返信になる（BR-37）。コメントなら送らない
      required:
      - body
    CreatePostRequest:
      type: object
      properties:
        body:
          type: string
          description: 本文（0〜280 文字）
          maxLength: 280
        images:
          type: array
          description: 画像（0〜4 枚、1 枚 5MB まで。JPEG・PNG・WebP・GIF。送った順が並び順）
          items:
            type: string
            format: binary
    CursorPageCommentResponse:
      type: object
      properties:
        items:
          type: array
          description: 一覧の中身（最大 20 件）
          items:
            $ref: "#/components/schemas/CommentResponse"
        nextCursor:
          type:
          - string
          - "null"
          description: 続きを取るためのカーソル。続きがなければ null
      required:
      - items
      - nextCursor
    CursorPagePostResponse:
      type: object
      properties:
        items:
          type: array
          description: 一覧の中身（最大 20 件）
          items:
            $ref: "#/components/schemas/PostResponse"
        nextCursor:
          type:
          - string
          - "null"
          description: 続きを取るためのカーソル。続きがなければ null
      required:
      - items
      - nextCursor
    CursorPageUserSummary:
      type: object
      properties:
        items:
          type: array
          description: 一覧の中身（最大 20 件）
          items:
            $ref: "#/components/schemas/UserSummary"
        nextCursor:
          type:
          - string
          - "null"
          description: 続きを取るためのカーソル。続きがなければ null
      required:
      - items
      - nextCursor
    FieldErrorDetail:
      type: object
      properties:
        code:
          type: string
          description: 誤りの種類
          enum:
          - REQUIRED
          - EMAIL_INVALID
          - EMAIL_TAKEN
          - PASSWORD_WEAK
          - PASSWORD_MISMATCH
          - CURRENT_PASSWORD_WRONG
          - USERNAME_INVALID
          - USERNAME_TAKEN
          - DISPLAY_NAME_LENGTH
          - BIO_TOO_LONG
          - BODY_TOO_LONG
          - QUERY_LENGTH
        field:
          type: string
          description: 入力欄の名前
          example: password
        message:
          type: string
          description: 画面にそのまま出せる日本語
      required:
      - code
      - field
      - message
    FollowingTimelineResponse:
      type: object
      properties:
        highlights:
          type: array
          description: 留守中のハイライト（最大 3 件）。カーソルなしで呼んだときだけ入る。続きの呼び出しでは空
          items:
            $ref: "#/components/schemas/PostResponse"
        items:
          type: array
          items:
            $ref: "#/components/schemas/PostResponse"
        nextCursor:
          type:
          - string
          - "null"
          description: 続きを取るためのカーソル。続きがなければ null
      required:
      - highlights
      - items
      - nextCursor
    Image:
      type: object
      properties:
        height:
          type: integer
          format: int32
        url:
          type: string
          description: 署名つき URL（期限 1 時間）
        width:
          type: integer
          format: int32
      required:
      - height
      - url
      - width
    ItemsUserSummary:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserSummary"
      required:
      - items
    LikeResponse:
      type: object
      description: 操作のあとの状態
      properties:
        likeCount:
          type: integer
          format: int64
        liked:
          type: boolean
      required:
      - likeCount
      - liked
    LikedVia:
      type: object
      description: 「山田さん、ほか 2 人がいいねしました」の表示
      properties:
        displayName:
          type: string
        othersCount:
          type: integer
          format: int64
          description: 表示名を出した人のほかに、いいねしたフォロー中の人の数
        username:
          type: string
      required:
      - displayName
      - othersCount
      - username
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    MeResponse:
      type: object
      description: ログインしている利用者
      properties:
        avatarUrl:
          type:
          - string
          - "null"
          description: アイコンの署名つき URL（期限 1 時間。NF-SE-06）。未設定なら null（画面は既定のアイコン）
        displayName:
          type: string
        email:
          type: string
          description: メールアドレス。返すのはこの形だけ
        id:
          type: integer
          format: int64
        username:
          type: string
      required:
      - avatarUrl
      - displayName
      - email
      - id
      - username
    PostResponse:
      type: object
      description: 投稿。インプレッション数・リツイートの数は持たない（BR-40、BR-41）
      properties:
        author:
          $ref: "#/components/schemas/UserSummary"
        body:
          type: string
        commentCount:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        editedAt:
          type:
          - string
          - "null"
          format: date-time
          description: 最後に編集した時刻。未編集なら null（BR-16）
        id:
          type: integer
          format: int64
        images:
          type: array
          description: 画像（並び順のとおり）。なければ空の配列
          items:
            $ref: "#/components/schemas/Image"
        isMine:
          type: boolean
          description: true のときだけ画面は編集・削除のメニューを出す（BR-12）
        likeCount:
          type: integer
          format: int64
        likedByMe:
          type: boolean
        likedVia:
          $ref: "#/components/schemas/LikedVia"
          description: フォロー中タブのいいね経由の投稿だけ値がある。ほかは null
      required:
      - author
      - body
      - commentCount
      - createdAt
      - editedAt
      - id
      - images
      - isMine
      - likeCount
      - likedByMe
      - likedVia
    Problem:
      type: object
      description: エラーの本文（ProblemDetail（RFC 9457）＋ code・errors）
      properties:
        code:
          type: string
          description: エラーの種類。画面はこの値でメッセージを選ぶ
          enum:
          - VALIDATION_FAILED
          - POST_EMPTY
          - IMAGE_TOO_MANY
          - CURRENT_PASSWORD_WRONG
          - UNAUTHENTICATED
          - LOGIN_FAILED
          - LOGIN_LOCKED
          - FORBIDDEN
          - CSRF_INVALID
          - NOT_FOUND
          - CONFLICT
          - IMAGE_TOO_LARGE
          - IMAGE_TYPE_INVALID
          - INTERNAL_ERROR
        detail:
          type: string
          description: 画面にそのまま出せる日本語
          example: 入力内容を確認してください
        errors:
          type: array
          description: 入力欄ごとの誤り。400（VALIDATION_FAILED）と 409 のときだけ付く
          items:
            $ref: "#/components/schemas/FieldErrorDetail"
        instance:
          type: string
          example: /api/auth/signup
        status:
          type: integer
          format: int32
          example: 400
        title:
          type: string
          example: Bad Request
      required:
      - code
      - detail
      - instance
      - status
      - title
    ProfileResponse:
      type: object
      description: プロフィール（UserSummary の項目に、フォロー数・フォロワー数・登録日時を足したもの）
      properties:
        avatarUrl:
          type:
          - string
          - "null"
          description: アイコンの署名つき URL（期限 1 時間。NF-SE-06）。未設定なら null（画面は既定のアイコン）
        bio:
          type: string
        createdAt:
          type: string
          format: date-time
          description: 登録日時
        displayName:
          type: string
        followedByMe:
          type: boolean
        followerCount:
          type: integer
          format: int64
        followingCount:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        isMe:
          type: boolean
          description: ログインしている利用者本人か
        username:
          type: string
      required:
      - avatarUrl
      - bio
      - createdAt
      - displayName
      - followedByMe
      - followerCount
      - followingCount
      - id
      - isMe
      - username
    SignupRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        password:
          type: string
          minLength: 1
          pattern: "^(?=.*[A-Za-z])(?=.*[0-9])[!-~]{8,72}$"
        passwordConfirmation:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 1
          pattern: "^[A-Za-z0-9_]{4,15}$"
      required:
      - email
      - password
      - passwordConfirmation
      - username
    UpdatePostRequest:
      type: object
      properties:
        body:
          type: string
          maxLength: 280
      required:
      - body
    UpdateProfileRequest:
      type: object
      description: 送った項目だけを変える（null・省略した項目は変えない）。文字数はコードポイントで数える
      properties:
        bio:
          type: string
          maxLength: 160
        displayName:
          type: string
          maxLength: 50
          minLength: 1
        username:
          type: string
          pattern: "^[A-Za-z0-9_]{4,15}$"
    UserSummary:
      type: object
      description: 利用者の要約。メールアドレスは含めない
      properties:
        avatarUrl:
          type:
          - string
          - "null"
          description: アイコンの署名つき URL（期限 1 時間。NF-SE-06）。未設定なら null（画面は既定のアイコン）
        bio:
          type: string
        displayName:
          type: string
        followedByMe:
          type: boolean
          description: ログインしている利用者がフォローしているか
        id:
          type: integer
          format: int64
        isMe:
          type: boolean
          description: ログインしている利用者本人か（true ならフォローボタンを出さない）
        username:
          type: string
      required:
      - avatarUrl
      - bio
      - displayName
      - followedByMe
      - id
      - isMe
      - username
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
