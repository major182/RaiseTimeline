# PR ごとに、手元の node scripts/check.mjs と同じチェックを GitHub 上でも動かす
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      # テストは Testcontainers で PostgreSQL を起動する（ubuntu-latest には Docker が入っている）
      - run: ./gradlew check
      # テストが書き出した API 仕様書が、コミットされたものと同じか（API を変えたら openapi.yaml もコミットする）
      - run: git diff --exit-code -- ../docs/api/openapi.yaml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  # E2E テスト（テスト仕様書 1 章）。E2E 用の DB を compose で起動し、Playwright が API と画面を起動して操作する
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # ブラウザは Chromium だけを入れる（--with-deps で、動かすのに要る OS のライブラリも入れる）
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # 失敗したときは、画面のスクリーンショットと操作の記録（トレース）を見られるように残す
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
