# 開発用の設定（./gradlew bootRun で有効になる）
app:
  auth:
    # 開発用の署名の鍵。本番では使わない（本番は環境変数 JWT_SECRET で別の値を渡す）
    jwt-secret: RcctqyDv7lfgCRuvH0bT54L+lS3u1GnYONH1bLRcEjY=
    # 開発中は HTTP（http://localhost）で動かすため、Secure を外す。外さないとブラウザが Cookie を送らない
    cookie-secure: false
spring:
  flyway:
    # 開発のときだけ、テストデータ（db/dev-data。DB 設計書 7 章）も読み込む。本番は db/migration だけ
    locations: classpath:db/migration,classpath:db/dev-data
# 開発中だけ Swagger UI（http://localhost:8080/swagger-ui.html）から API を試せるようにする（API 設計書 5 章）
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
