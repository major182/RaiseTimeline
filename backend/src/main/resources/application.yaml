spring:
  application:
    name: raisetimeline
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/raisetimeline}
    username: ${DB_USER:raisetimeline}
    password: ${DB_PASSWORD:raisetimeline}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

# 認証（JWT。技術選定書 4.1）
app:
  auth:
    # アクセストークンの署名の鍵（256 ビット以上のランダムな値を Base64 で）。本番はパラメータストアから環境変数で渡す
    jwt-secret: ${JWT_SECRET}
    issuer: raisetimeline
    access-token-ttl: 15m
    # ログインの有効期限は最後の操作から 7 日（BR-07）
    refresh-token-ttl: 7d
    # リフレッシュトークンの Cookie を HTTPS のときだけ送る（NF-SE-02）
    cookie-secure: true

management:
  endpoints:
    web:
      exposure:
        include: health
