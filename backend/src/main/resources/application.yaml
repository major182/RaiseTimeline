spring:
  application:
    name: raisetimeline
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/raisetimeline}
    username: ${DB_USER:raisetimeline}
    password: ${DB_PASSWORD:raisetimeline}
  # 画像のアップロードの上限（API 設計書 5 章）。1 枚 5MB（BR-22）、1 回の送信は画像 4 枚と本文で 21MB まで。超えたら 413
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 21MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

# 認証（JWT。技術選定書 4.1）
app:
  auth:
    # アクセストークンの署名の鍵（256 ビット以上のランダムな値を Base64 で）。本番はパラメータストアから環境変数で渡す
    jwt-secret: ${JWT_SECRET}
    issuer: raisetimeline
    access-token-ttl: 15m
    # ログインの有効期限は最後の操作から 7 日（BR-07）
    refresh-token-ttl: 7d
    # リフレッシュトークンの Cookie を HTTPS のときだけ送る（NF-SE-02）
    cookie-secure: true
  # タイムライン（BR-52。数値は仮の値で、使ってみて調整する。要件定義書 Q-07）
  timeline:
    # 最後にフォロー中タブを開いてから、これだけたっていたら留守中のハイライトを出す
    highlight-after: 6h
    # 留守中のハイライトの最大の件数
    highlight-count: 3
  # 画像の保存先（技術選定書 4.3）。開発・テストは local（ローカルのフォルダ）、本番は s3
  storage:
    type: ${STORAGE_TYPE:local}
    local-dir: ${STORAGE_LOCAL_DIR:./data/media}
    # s3 のときのバケット（非公開）。本番は環境変数で渡す
    s3-bucket: ${S3_BUCKET:}
    # 署名つき URL の期限（NF-SE-06）
    url-ttl: 1h
  # ログに付ける環境の名前と版（Datadog の env・version。ログ設計書 2 章）。デプロイのときに環境変数で渡す
  logging:
    env: ${APP_ENV:local}
    version: ${APP_VERSION:}

server:
  # ALB の後ろで動くため、X-Forwarded-For から利用者の IP を取る（ログの network.client.ip。ログ設計書 4 章）
  forward-headers-strategy: native
  # 画面のファイル（JS は約 670KB）と API の応答を、ブラウザが対応していれば gzip で圧縮して送る（性能テスト設計書 8 章、#90）。
  # 小さい応答は圧縮しても縮まらないので、1KB 以上だけにする
  compression:
    enabled: true
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json,application/problem+json,image/svg+xml
    min-response-size: 1KB
  tomcat:
    # 上限を超えたアップロードでも、413 の応答を返せるよう本文を読み切る（既定の 2MB では接続が切られることがある）
    max-swallow-size: 25MB

# Swagger UI（API 設計書 5 章）。本番・テストでは出さない。開発（application-dev.yaml）だけ有効にする
springdoc:
  api-docs:
    enabled: false
  # 書き出す API 仕様書（docs/api/openapi.yaml）の並びを毎回同じにする
  writer-with-order-by-keys: true
  # 応答の形式を */* ではなく JSON と書く
  default-produces-media-type: application/json
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health

# ログ（ログ設計書）。1 行 1 件の JSON を標準出力に書く。Debug は出さない（Info 以上）
logging:
  structured:
    format:
      console: com.raisetimeline.common.logging.DatadogJsonFormatter
  level:
    root: INFO
