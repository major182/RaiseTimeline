# 開発用の PostgreSQL。起動: docker compose up -d
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${DB_NAME:-raisetimeline}
      POSTGRES_USER: ${DB_USER:-raisetimeline}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-raisetimeline}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
