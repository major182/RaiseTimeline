# 開発用の PostgreSQL。起動: docker compose up -d
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${DB_NAME:-raisetimeline}
      POSTGRES_USER: ${DB_USER:-raisetimeline}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-raisetimeline}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # E2E テスト（Playwright）用の PostgreSQL。起動: docker compose --profile e2e up -d --wait db-e2e
  # 開発用の DB を汚さないよう別にし、データはメモリ（tmpfs）に置いてコンテナを作り直すたびに空から始める
  db-e2e:
    image: postgres:18.6
    profiles: [e2e]
    environment:
      POSTGRES_DB: raisetimeline
      POSTGRES_USER: raisetimeline
      POSTGRES_PASSWORD: raisetimeline
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raisetimeline -d raisetimeline"]
      interval: 2s
      timeout: 3s
      retries: 30

  # 性能テスト用の PostgreSQL（性能テスト設計書）。node scripts/perf.ts が起動し、終わったら volume ごと消す
  # 大量のデータを置き、実際に近いディスクの読み書きで測るため、tmpfs ではなく volume にする
  db-perf:
    image: postgres:18.6
    profiles: [perf]
    environment:
      POSTGRES_DB: raisetimeline
      POSTGRES_USER: raisetimeline
      POSTGRES_PASSWORD: raisetimeline
    ports:
      - "5434:5432"
    volumes:
      - db-perf-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raisetimeline -d raisetimeline"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
  db-perf-data:
